#
# Dev override: hot reload via Compose Watch (Docker Compose >= 2.22).
#   docker compose -f compose.yaml -f compose.dev.yaml up --build --watch
#
# Compose Watch copies changed files into the container rather than bind-mounting,
# so file-change events fire reliably on Windows/WSL2 without polling.

services:
  frontend:
    image: foc-frontend-dev
    build:
      context: ./frontend
      target: dev
    container_name: foc-frontend
    restart: "no"
    ports: !override
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      FRONTEND_API_PROXY_TARGET: http://order-service:3000
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.js:/app/vite.config.js
      - ./frontend/tailwind.config.js:/app/tailwind.config.js
      - ./frontend/postcss.config.js:/app/postcss.config.js
    depends_on:
      order-service:
        condition: service_started

  order-service:
    build:
      target: dev
    restart: "no"
    environment:
      NODE_ENV: development
    develop:
      watch:
        - action: sync
          path: ./order-service/src
          target: /app/src
          ignore:
            - generated/
        - action: sync
          path: ./order-service/test
          target: /app/test
        # Schema/migration changes: restart -> container re-runs generate + migrate deploy
        - action: sync+restart
          path: ./order-service/prisma
          target: /app/prisma
        - action: rebuild
          path: ./order-service/package.json
        - action: rebuild
          path: ./order-service/package-lock.json
